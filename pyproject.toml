    "langchain-google-genai>=4.5.1",
    "langchain-ollama>=1.1.0",
    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.23",
    "pinecone>=7.3.0",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
